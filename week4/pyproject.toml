[project]
name = "dev-journal"
version = "0.4.0"
requires-python = ">=3.10"
dependencies = ["typer>=0.12"]

[project.scripts]
journal = "journal.cli:app"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "journal"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
